name: Release

# Push a tag like v2.0.1 to build the Windows installer and publish a GitHub Release:
#   git tag v2.0.1 && git push origin v2.0.1
# The tag must match APP_VERSION in config/settings.py.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write                # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $appVersion = python -c "from config import settings; print(settings.APP_VERSION)"
          if ($tag -ne $appVersion) {
            Write-Error "Tag v$tag does not match APP_VERSION $appVersion in config/settings.py"
            exit 1
          }
          "VERSION=$tag" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build app (PyInstaller)
        run: python -m PyInstaller --noconfirm "PyPass Manager.spec"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" installer\PyPassManager.iss

      - name: Zip portable version
        shell: pwsh
        run: Compress-Archive -Path "dist\PyPass Manager\*" -DestinationPath "PyPass-Manager-$env:VERSION-portable.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PyPass Manager ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            installer/Output/PyPass-Manager-Setup-${{ env.VERSION }}.exe
            PyPass-Manager-${{ env.VERSION }}-portable.zip
